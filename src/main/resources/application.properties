spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ledger
spring.datasource.username=ledger
spring.datasource.password=ledger
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=2s -c statement_timeout=5s -c idle_in_transaction_session_timeout=5s
server.shutdown=graceful
server.tomcat.connection-timeout=10s
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.jackson.property-naming-strategy=SNAKE_CASE
